[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arctus-causal-engine"
version = "1.0.0"
description = "Autonomous causal engine for the Arctus Agent Orchestration Framework"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.8.0",
    "psutil>=5.9.0",
]

[project.scripts]
causal-engine = "arctus_causal_engine.__main__:main"
