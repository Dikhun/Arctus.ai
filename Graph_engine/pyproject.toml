[tool.poetry]
name = "confidence-graph-engine"
version = "1.0.0"
description = "Enterprise-grade Confidence Graph Engine"
authors = ["Autonomous Engineering Protocol <eng@example.com>"]
readme = "README.md"
packages = [{include = "cge"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
pydantic = "^2.0"
prometheus-client = "^0.20.0"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
hypothesis = "^6.100"
httpx = "^0.27"
mypy = "^1.9"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
