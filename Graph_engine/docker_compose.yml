version: "3.8"

services:
  cge:
    build:
      context: ..
 dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CGE_LOG_LEVEL=info
      - CGE_PROPAGATION_DECAY=0.95
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

 prometheus:
    image: prom/prometheus:v2.51.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

 grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=cge
