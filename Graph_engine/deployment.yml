apiVersion: apps/v1
kind: Deployment
metadata:
  name: confidence-graph-engine
  labels:
    app: cge
spec:
  replicas: 2
  selector:
    matchLabels:
 app: cge
  template:
    metadata:
      labels:
        app: cge
    spec:
      containers:
        - name: cge
          image: confidence-graph-engine:1.0.0
          ports:
            - containerPort: 8000
          env:
            - name: CGE_LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cge-service
spec:
 selector:
    app: cge
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
