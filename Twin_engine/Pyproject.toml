[project]
name = "arctus-supervisor"
version = "0.1.0"
description = "Arctus AI OS — Digital Twin Engine & Process Supervisor"
requires-python = ">=3.11"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "structlog>=24.1",
    "watchfiles>=0.21",
    "gitpython>=3.1",
    "networkx>=3.2",
    "rich>=13.7",
    "aiofiles>=23.2",
]

[project.scripts]
arctus = "arctus_supervisor.main:app"

[tool.ruff]
target-version = "py311"
line-length = 120
