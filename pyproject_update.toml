# /// script
# dependencies = [
#     "gitpython>=3.1.0"
# ]
# ///

import re
from pathlib import Path
import subprocess

def bump_version_and_release():
    print("[Release Engine] Initializing automated version bump to v1.1.0...")
    
    pyproject_path = Path("pyproject.toml")
    if pyproject_path.exists():
        content = pyproject_path.read_text()
        # Update version string in pyproject.toml
        new_content = re.sub(r'version = ".*?"', 'version = "1.1.0"', content)
        pyproject_path.write_text(new_content)
        print("[Release Engine] Updated pyproject.toml to v1.1.0")

    # Git operations to commit, tag, and push
    commands = [
        ["git", "add", "pyproject.toml", "twin_engine.py"],
        ["git", "commit", "-m", "chore(release): bump version to v1.1.0 with Digital Twin Engine"],
        ["git", "tag", "-a", "v1.1.0", "-m", "Arctus.ai v1.1.0: Autonomous Digital Twin & Supervisor Integration"],
        ["git", "push", "origin", "main", "--tags"]
    ]

    for cmd in commands:
        print(f"[Executing] {' '.join(cmd)}")
        result = subprocess.run(cmd, capture_output=True, text=True)
        if result.returncode != 0:
            print(f"[Error] Command failed: {result.stderr}")
            break
    else:
        print("[Release Engine] Successfully published release v1.1.0 to GitHub repository.")

if __name__ == "__main__":
    bump_version_and_release()
    
